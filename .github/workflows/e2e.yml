name: E2E (Playwright)

on:
  schedule:
    # 09:00 America/Sao_Paulo (BRT, UTC-3) = 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'apps/e2e/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: code_connect
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: code_connect
      PORT: 3000
      WEB_ORIGIN: http://localhost:5173
      VITE_API_BASE_URL: http://localhost:3000/v1
      E2E_BASE_URL: http://localhost:5173
      E2E_API_URL: http://localhost:3000/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter api build

      - name: Start API
        run: pnpm --filter api start:prod &

      - name: Wait for API
        run: pnpm dlx wait-on http://localhost:3000/v1/posts --timeout 60000

      - name: Seed database
        run: pnpm --filter api seed

      - name: Build web
        run: pnpm --filter web build

      - name: Start web preview
        run: pnpm --filter web preview --port 5173 --host &

      - name: Wait for web
        run: pnpm dlx wait-on http://localhost:5173 --timeout 60000

      - name: Install Playwright browsers
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm --filter e2e test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/e2e/test-results/
          retention-days: 7
